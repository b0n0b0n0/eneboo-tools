name: Construir Narrador M4B

on:
  pull_request:
    branches: [master]
    paths:
      - "narrador-m4b-source.part*"
      - ".github/workflows/narrador-m4b.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos-arm64:
    name: App macOS Apple Silicon
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Reconstruir fuentes
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          pieces = sorted(Path('.').glob('narrador-m4b-source.part*'))
          if not pieces:
              raise SystemExit('No se encontraron las partes del código fuente')
          encoded = ''.join(p.read_text(encoding='utf-8') for p in pieces)
          Path('/tmp/narrador-m4b-source.zip').write_bytes(base64.b64decode(encoded))
          PY
          unzip -q /tmp/narrador-m4b-source.zip

      - name: Construir aplicación y DMG
        run: |
          chmod +x narrador-m4b/build.sh
          narrador-m4b/build.sh

      - name: Publicar instalador
        uses: actions/upload-artifact@v4
        with:
          name: NarradorM4B-macOS-arm64
          path: narrador-m4b/dist/NarradorM4B-macOS-arm64.dmg
          if-no-files-found: error
          retention-days: 30
